name: Daily market scan

on:
  workflow_dispatch:
  schedule:
    # 22:30 UTC Monday-Friday = 06:30 Malaysia time the next morning.
    # This is safely after the U.S. close in both EDT and EST.
    - cron: "30 22 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "daily-market-scan"
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Run completed-candle scan
        run: python scripts/run_scan.py

      - name: Save generated reports to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "data: daily scan $(date -u +%F)"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
